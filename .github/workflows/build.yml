name: Compilar Cassy (.jar)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Encontrar el proyecto (raiz, subcarpeta o .zip)
        run: |
          PROJECT_DIR=""
          if [ -f build.gradle ] && [ -d src/main/java ]; then
            PROJECT_DIR=.
          else
            # proyecto dentro de una subcarpeta (por ejemplo Cassy/)
            for B in $(find . -maxdepth 3 -name build.gradle -not -path './.git/*' -not -path './work/*'); do
              D=$(dirname "$B")
              if [ -d "$D/src/main/java" ]; then PROJECT_DIR="$D"; break; fi
            done
          fi
          if [ -z "$PROJECT_DIR" ]; then
            # proyecto dentro de un .zip subido al repositorio
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "Descomprimiendo $ZIP en work/"
              mkdir -p work && unzip -q -o "$ZIP" -d work
              for B in $(find work -maxdepth 3 -name build.gradle); do
                D=$(dirname "$B")
                if [ -d "$D/src/main/java" ]; then PROJECT_DIR="$D"; break; fi
              done
            fi
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: no encuentro build.gradle junto a src/main/java en el repositorio."
            echo "Sube el mod CON sus carpetas (build.gradle, src, ...) o sube el .zip del mod."
            ls -la; exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "Archivos .java: $(find "$PROJECT_DIR/src/main/java" -name '*.java' | wc -l)"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Compilar
        run: gradle build --no-daemon --console=plain --stacktrace -p "$PROJECT_DIR"

      - name: Comprobar que el .jar tiene el mod dentro
        run: |
          ls -la "$PROJECT_DIR/build/libs"
          JAR=$(ls "$PROJECT_DIR"/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Revisando $JAR"
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml' || { echo "ERROR: el jar no contiene mods.toml"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/cassy/CassyMod.class' || { echo "ERROR: el jar no contiene clases compiladas"; exit 1; }
          echo "OK: el jar contiene el mod"

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: Cassy-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/build/libs/*.jar
